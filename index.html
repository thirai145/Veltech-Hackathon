<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CYBERTEX</title>
  <meta name="description" content="Sign in to your CYBERTEX enterprise cybersecurity account securely.">

  <!-- Google Fonts: Inter (400, 500, 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background Watermark -->
  <div class="watermark" aria-hidden="true">CYBERTEX</div>

  <!-- Main Sign-in Container -->
  <main class="signin-container">
    <div class="signin-card">
      <header class="signin-header">
        <h1 class="signin-title">Welcome to Cybertex</h1>
        <p class="signin-subtitle">Sign in to your account</p>
      </header>

      <!-- Global Form Alert (for server/auth feedback) -->
      <div id="form-alert" class="form-alert" role="alert" aria-live="polite" hidden></div>

      <!-- Google Sign-In Button Container -->
      <div id="google-button-container" style="display: flex; justify-content: center; width: 100%;"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
