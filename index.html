<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - CYBERTEX</title>
  <meta name="description" content="Sign in to your CYBERTEX enterprise cybersecurity account securely.">

  <!-- Google Fonts: Inter (400, 500, 600) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Background Watermark -->
  <div class="watermark" aria-hidden="true">CYBERTEX</div>

  <!-- Main Sign-in Container -->
  <main class="signin-container">
    <div class="signin-card">
      <header class="signin-header">
        <h1 class="signin-title">Welcome to Cybertex</h1>
        <p class="signin-subtitle">Sign in to your account</p>
      </header>

      <!-- Global Form Alert (for server/auth feedback) -->
      <div id="form-alert" class="form-alert" role="alert" aria-live="polite" hidden></div>

      <!-- Sign-in Form -->
      <form id="signin-form" class="signin-form" novalidate>
        <!-- Email Field -->
        <div class="form-group" id="group-email">
          <label for="email" class="form-label">Email Address</label>
          <input
            type="email"
            id="email"
            name="email"
            class="form-input"
            placeholder="Enter your email address"
            autocomplete="email"
            spellcheck="false"
            aria-describedby="email-error"
            aria-required="true"
          >
          <p id="email-error" class="field-error" aria-live="polite"></p>
        </div>

        <!-- Password Field -->
        <div class="form-group" id="group-password">
          <label for="password" class="form-label">Password</label>
          <div class="password-input-wrapper">
            <input
              type="password"
              id="password"
              name="password"
              class="form-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-describedby="password-error"
              aria-required="true"
            >
            <button
              type="button"
              id="password-toggle"
              class="password-toggle"
              aria-label="Show password"
              title="Show password"
            >
              <!-- Eye Icon (visible when password is hidden) -->
              <svg id="eye-icon" class="toggle-icon" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 10s3.5-6.5 9-6.5S19 10 19 10s-3.5 6.5-9 6.5S1 10 1 10z"/>
                <circle cx="10" cy="10" r="3"/>
              </svg>
              <!-- Eye Off Icon (visible when password is shown) -->
              <svg id="eye-off-icon" class="toggle-icon hidden" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 10 19.5C4.5 19.5 1 13 1 13a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 10 4.25c5.5 0 9 6.5 9 6.5a18.3 18.3 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="19" y2="19"/>
              </svg>
            </button>
          </div>
          <p id="password-error" class="field-error" aria-live="polite"></p>
        </div>

        <!-- Submit Button -->
        <button type="submit" id="submit-btn" class="signin-button">
          <span class="btn-spinner" aria-hidden="true"></span>
          <span class="btn-text">Sign In</span>
        </button>
      </form>

      <!-- Divider -->
      <div class="divider">
        <span class="divider-text">OR</span>
      </div>

      <!-- Google Sign-In Button Container -->
      <div id="google-button-container" style="display: flex; justify-content: center; width: 100%;"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
