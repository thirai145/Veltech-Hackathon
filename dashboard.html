<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBERTEX – Phishing Radar</title>
  <meta name="description" content="CYBERTEX real-time phishing detection dashboard for your Gmail inbox.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
/* ── Tokens ── */
:root {
  --bg:            #f0f2f5;
  --surface:       #ffffff;
  --border:        #e2e5ea;
  --border-h:      #c8cdd6;
  --sb-bg:         #1a1f2e;
  --sb-hover:      #252b3b;
  --sb-active:     #2d3449;
  --sb-text:       #9aa3b8;
  --sb-text-a:     #ffffff;
  --hdr-bg:        #ffffff;
  --txt:           #111827;
  --txt2:          #6b7280;
  --muted:         #9ca3af;
  --accent:        #2563eb;
  --accent-h:      #1d4ed8;
  /* risk */
  --safe:     #16a34a; --safe-bg:   #f0fdf4; --safe-bd:   #bbf7d0;
  --low:      #65a30d; --low-bg:    #f7fee7; --low-bd:    #d9f99d;
  --med:      #d97706; --med-bg:    #fffbeb; --med-bd:    #fde68a;
  --high:     #dc2626; --high-bg:   #fef2f2; --high-bd:   #fecaca;
  --crit:     #7c3aed; --crit-bg:   #faf5ff; --crit-bd:   #ddd6fe;
  --sh-sm: 0 1px 2px rgba(0,0,0,.05);
  --sh-md: 0 4px 6px -1px rgba(0,0,0,.07),0 2px 4px -2px rgba(0,0,0,.05);
  --r-sm:4px; --r-md:8px; --r-lg:12px;
  --sb-w:220px; --hdr-h:56px;
  --tr:150ms ease;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:'Inter',-apple-system,sans-serif;font-size:14px;color:var(--txt);background:var(--bg);line-height:1.5;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}

/* ── Shell ── */
.shell{display:flex;height:100vh;overflow:hidden}

/* ── Sidebar ── */
.sb{width:var(--sb-w);background:var(--sb-bg);display:flex;flex-direction:column;flex-shrink:0;transition:transform var(--tr);z-index:200;overflow:hidden}
.sb-logo{display:flex;align-items:center;gap:10px;padding:0 16px;height:var(--hdr-h);border-bottom:1px solid rgba(255,255,255,.06);flex-shrink:0}
.logo-icon{width:30px;height:30px;background:var(--accent);border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.logo-icon svg{width:16px;height:16px;color:white}
.logo-name{font-size:15px;font-weight:700;color:#fff;letter-spacing:.04em}
.logo-tag{font-size:10px;color:var(--sb-text);letter-spacing:.06em;text-transform:uppercase}
.sb-nav{flex:1;overflow-y:auto;padding:12px 8px}
.nav-lbl{font-size:10px;font-weight:600;color:var(--sb-text);text-transform:uppercase;letter-spacing:.08em;padding:8px 8px 4px;margin-top:8px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--sb-text);font-size:13px;font-weight:500;cursor:pointer;transition:background var(--tr),color var(--tr);user-select:none;white-space:nowrap}
.nav-item:hover{background:var(--sb-hover);color:var(--sb-text-a)}
.nav-item.active{background:var(--sb-active);color:var(--sb-text-a)}
.nav-item svg{width:16px;height:16px;flex-shrink:0}
.nav-badge{margin-left:auto;background:rgba(255,255,255,.1);color:var(--sb-text);font-size:11px;font-weight:600;padding:1px 7px;border-radius:10px;min-width:20px;text-align:center}
.nav-item.active .nav-badge{background:rgba(37,99,235,.3);color:#93c5fd}
.r-crit .nav-badge{background:rgba(124,58,237,.2);color:#c4b5fd}
.r-high .nav-badge{background:rgba(220,38,38,.2);color:#fca5a5}
.r-med  .nav-badge{background:rgba(217,119,6,.2);color:#fcd34d}
.r-safe .nav-badge{background:rgba(22,163,74,.2);color:#86efac}
.sb-foot{padding:12px 8px;border-top:1px solid rgba(255,255,255,.06);flex-shrink:0}
.sb-user{display:flex;align-items:center;gap:10px;padding:6px 2px}
.sb-uname{font-size:12px;font-weight:600;color:#e2e8f0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.sb-uemail{font-size:11px;color:var(--sb-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;min-width:0;overflow:hidden}

/* ── Header ── */
.hdr{height:var(--hdr-h);background:var(--hdr-bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;padding:0 16px;flex-shrink:0;box-shadow:var(--sh-sm)}
.icon-btn{width:34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-sm);color:var(--txt2);transition:background var(--tr);position:relative}
.icon-btn:hover{background:var(--bg)}
.icon-btn svg{width:18px;height:18px}
.notif-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;background:var(--high);border-radius:50%;border:2px solid white}
.search-wrap{flex:1;max-width:480px;position:relative}
.search-wrap input{width:100%;height:34px;border:1px solid var(--border);border-radius:20px;background:var(--bg);padding:0 12px 0 36px;font-size:13px;color:var(--txt);outline:none;transition:border-color var(--tr),box-shadow var(--tr)}
.search-wrap input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(37,99,235,.1);background:white}
.search-wrap input::placeholder{color:var(--muted)}
.search-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search-ico svg{width:15px;height:15px}
.hdr-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.u-avatar{width:32px;height:32px;border-radius:50%;object-fit:cover;border:2px solid var(--border);cursor:pointer;transition:border-color var(--tr)}
.u-avatar:hover{border-color:var(--accent)}
.u-init{width:32px;height:32px;border-radius:50%;color:white;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;cursor:pointer}

/* ── Content body ── */
.body{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:16px}

/* ── Summary cards ── */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;box-shadow:var(--sh-sm)}
.stat-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:6px}
.stat-val{font-size:24px;font-weight:700;color:var(--txt);line-height:1}
.stat-sub{font-size:11px;color:var(--muted);margin-top:4px}
.stat-card.s-safe  .stat-val{color:var(--safe)}
.stat-card.s-med   .stat-val{color:var(--med)}

/* ── Email panel ── */
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-md);box-shadow:var(--sh-sm);overflow:hidden;flex:1;display:flex;flex-direction:column;min-height:0}
.toolbar{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border);background:#fafbfc;flex-shrink:0}
.toolbar-info .t-title{font-size:13px;font-weight:600;color:var(--txt)}
.toolbar-info .t-sub{font-size:12px;color:var(--muted);margin-top:1px}
.refresh-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--border);border-radius:var(--r-sm);font-size:12px;font-weight:500;color:var(--txt2);background:white;transition:background var(--tr),border-color var(--tr)}
.refresh-btn:hover{background:var(--bg);border-color:var(--border-h)}
.refresh-btn svg{width:13px;height:13px}
.refresh-btn.spinning svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── Email list ── */
.email-list{overflow-y:auto;flex:1}
.erow{display:grid;grid-template-columns:44px 1fr auto;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);cursor:pointer;transition:background var(--tr);gap:12px}
.erow:hover{background:#f8f9fa}
.erow.unread{background:#fafbff}
.erow.unread .e-subject{font-weight:700}
.erow:last-child{border-bottom:none}
.e-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:white;flex-shrink:0}
.e-main{min-width:0}
.e-top{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
.e-name{font-size:13px;font-weight:600;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.e-email{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-subject{font-size:13px;font-weight:500;color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.e-preview{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0}
.e-date{font-size:11px;color:var(--muted);white-space:nowrap}

/* ── Risk badge ── */
.rbadge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:10px;font-size:10px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid}
.rbadge.SAFE       {background:var(--safe-bg);color:var(--safe);border-color:var(--safe-bd)}
.rbadge.SUSPICIOUS {background:var(--med-bg);color:var(--med);border-color:var(--med-bd)}
.rscore{font-size:10px;font-weight:600;color:var(--muted)}

/* ── Direction badge ── */
.dbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:10px;font-size:9px;font-weight:700;letter-spacing:.04em;white-space:nowrap;border:1px solid;text-transform:uppercase}
.dbadge.INCOMING{background:#eff6ff;color:#2563eb;border-color:#bfdbfe}
.dbadge.OUTGOING{background:#fdf4ff;color:#a855f7;border-color:#e9d5ff}
.dbadge.REPLY{background:#ecfdf5;color:#059669;border-color:#a7f3d0}
.dbadge.UNKNOWN{background:#f5f5f5;color:#737373;border-color:#d4d4d4}
.dbadge svg{width:10px;height:10px}

/* ── States ── */
.state-box{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;text-align:center}
.state-ico{width:48px;height:48px;border-radius:50%;background:var(--bg);display:flex;align-items:center;justify-content:center;margin-bottom:16px;color:var(--muted)}
.state-ico svg{width:24px;height:24px}
.state-title{font-size:15px;font-weight:600;color:var(--txt);margin-bottom:6px}
.state-msg{font-size:13px;color:var(--muted);max-width:320px}
.spinner{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}

/* ── Detail overlay ── */
.d-overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:300;display:none}
.d-overlay.open{display:block;animation:fdin 150ms ease}
@keyframes fdin{from{opacity:0}to{opacity:1}}
.d-panel{position:fixed;top:0;right:0;width:min(700px,100vw);height:100vh;background:var(--surface);border-left:1px solid var(--border);box-shadow:-8px 0 32px rgba(0,0,0,.12);display:flex;flex-direction:column;z-index:301;transform:translateX(100%);transition:transform 250ms cubic-bezier(.4,0,.2,1)}
.d-overlay.open .d-panel{transform:translateX(0)}
.d-hdr{display:flex;align-items:center;gap:12px;padding:14px 20px;border-bottom:1px solid var(--border);flex-shrink:0}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;color:var(--txt2);padding:5px 10px;border-radius:var(--r-sm);transition:background var(--tr)}
.back-btn:hover{background:var(--bg)}
.back-btn svg{width:15px;height:15px}
.d-title{font-size:15px;font-weight:600;color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.d-actions{display:flex;gap:8px}
.d-action-btn{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:6px 10px;border-radius:4px;cursor:pointer;border:1px solid var(--border);background:white;color:var(--txt)}
.d-action-btn:hover{background:#f9fafb}
.d-action-btn.primary{background:var(--accent);color:white;border-color:var(--accent-h)}
.d-action-btn.primary:hover{background:var(--accent-h)}
.d-body{flex:1;overflow-y:auto;padding:20px}
.d-meta{background:#fafbfc;border:1px solid var(--border);border-radius:var(--r-md);padding:14px 16px;margin-bottom:16px}
.d-meta-row{display:flex;gap:8px;font-size:13px;margin-bottom:6px}
.d-meta-row:last-child{margin-bottom:0}
.d-meta-lbl{font-weight:600;color:var(--txt2);width:70px;flex-shrink:0}
.d-meta-val{color:var(--txt);word-break:break-word}
.d-sec-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--border)}
.d-content{font-size:13px;line-height:1.7;color:var(--txt);background:var(--bg);border:1px solid var(--border);border-radius:var(--r-md);padding:16px;margin-bottom:16px;white-space:pre-wrap;word-break:break-word;max-height:260px;overflow-y:auto}
.analysis-card{border:1px solid var(--border);border-radius:var(--r-md);overflow:hidden;margin-bottom:16px}
.ac-hdr{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--border)}
.ac-hdr-title{font-size:13px;font-weight:600}
.score-row{display:flex;align-items:center;gap:16px;padding:16px}
.score-circle{width:68px;height:68px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;flex-shrink:0;font-weight:700;border:2px solid}
.score-circle.SAFE       {background:var(--safe-bg);border-color:var(--safe);color:var(--safe)}
.score-circle.SUSPICIOUS {background:var(--med-bg);border-color:var(--med);color:var(--med)}
.score-num{font-size:20px;line-height:1}
.score-den{font-size:10px;opacity:.7}
.score-info{flex:1}
.score-level{font-size:16px;font-weight:700;margin-bottom:3px}
.score-level.SAFE       {color:var(--safe)}
.score-level.SUSPICIOUS {color:var(--med)}
.score-conf{font-size:12px;color:var(--txt2);margin-bottom:3px}
.score-expl{font-size:12px;color:var(--txt2)}
.reasons-block{padding:0 16px 16px}
.reason-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;color:var(--txt2);padding:7px 0;border-top:1px solid var(--border)}
.reason-item:first-child{border-top:none}
.reason-item svg{width:14px;height:14px;flex-shrink:0;margin-top:1px}
.url-block{padding:0 16px 16px}
.url-item{font-size:12px;color:var(--txt2);font-family:monospace;padding:4px 8px;background:var(--bg);border-radius:4px;margin-top:4px;word-break:break-all}
.action-card{border-radius:var(--r-md);padding:14px 16px;display:flex;gap:10px;align-items:flex-start;margin-bottom:16px;border:1px solid}
.action-card.safe    {background:var(--safe-bg);border-color:var(--safe-bd)}
.action-card.warning {background:var(--high-bg);border-color:var(--high-bd)}
.action-card svg{width:18px;height:18px;flex-shrink:0;margin-top:1px}
.action-card.safe svg    {color:var(--safe)}
.action-card.warning svg {color:var(--high)}
.action-lbl{font-size:13px;font-weight:600;color:var(--txt);margin-bottom:2px}
.action-txt{font-size:13px;color:var(--txt2);line-height:1.5}

/* ── Mobile sidebar overlay ── */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:199}

/* ── Toast ── */
.toast-wrap{position:fixed;bottom:20px;right:20px;z-index:400;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--sb-bg);color:white;padding:10px 16px;border-radius:var(--r-md);font-size:13px;box-shadow:var(--sh-md);animation:slideup 200ms ease}
@keyframes slideup{from{transform:translateY(8px);opacity:0}to{transform:translateY(0);opacity:1}}

/* ── Responsive ── */
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}}
@media(max-width:768px){
  .sb{position:fixed;top:0;left:0;height:100%;transform:translateX(-100%)}
  .sb.open{transform:translateX(0)}
  .sb-overlay{display:block}
  .sb-overlay.vis{display:block}
  .e-email{display:none}
  .stats{grid-template-columns:repeat(2,1fr)}
}
@media(max-width:520px){
  .stats{grid-template-columns:1fr 1fr}
  .erow{grid-template-columns:36px 1fr auto}
  .e-preview{display:none}
  .body{padding:12px}
  .d-panel{width:100vw}
}
  </style>
</head>
<body>
<div class="sb-overlay" id="sb-overlay" onclick="closeSB()"></div>
<div class="toast-wrap" id="toasts"></div>

<div class="shell">
  <!-- Sidebar -->
  <aside class="sb" id="sidebar">
    <div class="sb-logo">
      <div class="logo-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">CYBERTEX</div>
        <div class="logo-tag">Phishing Radar</div>
      </div>
    </div>

    <nav class="sb-nav">
      <div class="nav-lbl">Mail</div>
      <div class="nav-item active" id="nav-all" onclick="setFilter('all')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2-2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
        Inbox
        <span class="nav-badge" id="b-all">–</span>
      </div>

      <div class="nav-lbl">Risk Levels</div>
      <div class="nav-item r-med" id="nav-SUSPICIOUS" onclick="setFilter('SUSPICIOUS')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        Suspicious
        <span class="nav-badge" id="b-SUSPICIOUS">0</span>
      </div>
      <div class="nav-item r-safe" id="nav-SAFE" onclick="setFilter('SAFE')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        Safe
        <span class="nav-badge" id="b-SAFE">0</span>
      </div>

      <div class="nav-lbl">Direction</div>
      <div class="nav-item" id="nav-INCOMING" onclick="setFilter('INCOMING')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
        Incoming
        <span class="nav-badge" id="b-INCOMING">0</span>
      </div>
      <div class="nav-item" id="nav-OUTGOING" onclick="setFilter('OUTGOING')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        Outgoing
        <span class="nav-badge" id="b-OUTGOING">0</span>
      </div>
      <div class="nav-item" id="nav-REPLY" onclick="setFilter('REPLY')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg>
        Reply
        <span class="nav-badge" id="b-REPLY">0</span>
      </div>

      <div class="nav-lbl">Account</div>
      <div class="nav-item" onclick="signOut()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        Sign Out
      </div>
    </nav>

    <div class="sb-foot">
      <div class="sb-user">
        <div id="sb-av"></div>
        <div>
          <div class="sb-uname" id="sb-name"></div>

  <!-- Main -->
  <div class="main">

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/>
        </svg>

      <div class="search-wrap">
        <span class="search-ico">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        </span>

        <button class="icon-btn" id="notif-btn" title="Risk alerts">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
          <span class="notif-dot" id="notif-dot" style="display:none"></span>
        </button>
        <div id="hdr-av"></div>

    </header>

    <!-- Body -->
    <div class="body">
      <!-- Stats -->
      <div class="stats">
        <div class="stat-card">
          <div class="stat-lbl">Total Analyzed</div>
          <div class="stat-val" id="st-total">–</div>
          <div class="stat-sub">Emails scanned</div>
        </div>
        <div class="stat-card s-safe">
          <div class="stat-lbl">Safe</div>
          <div class="stat-val" id="st-safe">–</div>
          <div class="stat-sub">No threats</div>
        </div>
        <div class="stat-card s-med">
          <div class="stat-lbl">Suspicious</div>
          <div class="stat-val" id="st-med">–</div>
          <div class="stat-sub">Review needed</div>
        </div>
      </div>

      <!-- Panel -->
      <div class="panel">
        <div class="toolbar">
          <div class="toolbar-info">
            <div class="t-title" id="t-title">Inbox</div>
            <div class="t-sub" id="t-sub">Loading your emails…</div>
          </div>
          <button class="refresh-btn" id="ref-btn" onclick="manualRefresh()">
            <svg id="ref-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
              <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
            </svg>
            Refresh
          </button>
        </div>
        <div class="email-list" id="email-list">
          <div class="state-box">
            <div class="spinner"></div>
            <div class="state-title">Connecting to Gmail…</div>
            <div class="state-msg">Fetching and analyzing your real inbox.</div>

  </div><!-- /main -->
</div><!-- /shell -->

<!-- Detail overlay -->
<div class="d-overlay" id="d-overlay" onclick="overlayClick(event)">
  <div class="d-panel" id="d-panel">
    <div class="d-hdr">
      <button class="back-btn" onclick="closeDetail()">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/>
        </svg>
        Back to inbox
      </button>
      <div class="d-title" id="d-title">–</div>
      <div class="d-actions" id="d-actions"></div>
      <span class="rbadge" id="d-badge"></span>
    </div>
    <div class="d-body" id="d-body"></div>
  </div>
</div>

<script>
/* ── State ── */
let allEmails = [], curFilter = 'all', searchQ = '';

/* ── Risk helpers ── */
const RISK_LABEL = {SAFE:'SAFE',SUSPICIOUS:'SUSPICIOUS'};
function riskLevel(a) {
  if (!a) return 'SAFE';
  return (a.score >= 21) ? 'SUSPICIOUS' : 'SAFE';
}
function riskLabel(lvl) { return RISK_LABEL[lvl] || lvl; }

/* ── Avatar helpers ── */
const COLORS = ['#2563eb','#7c3aed','#db2777','#d97706','#059669','#0891b2'];
function colorFor(s){ let h=0; for(let c of s) h=c.charCodeAt(0)+((h<<5)-h); return COLORS[Math.abs(h)%COLORS.length]; }
function initials(n){ return (n||'?').split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase(); }

/* ── Toast ── */
function toast(msg,ms=3000){
  const t=document.createElement('div');t.className='toast';t.textContent=msg;
  document.getElementById('toasts').appendChild(t);
  setTimeout(()=>t.remove(),ms);
}

/* ── Sidebar ── */
function toggleSB(){
  const s=document.getElementById('sidebar'),o=document.getElementById('sb-overlay');
  const open=s.classList.toggle('open');o.classList.toggle('vis',open);
}
function closeSB(){ document.getElementById('sidebar').classList.remove('open');document.getElementById('sb-overlay').classList.remove('vis'); }

/* ── Sign out ── */
function signOut(){ fetch('/api/auth/logout',{method:'POST'}).then(()=>location.href='/index.html'); }

/* ── Render user ── */
function renderUser(u){
  document.getElementById('sb-name').textContent  = u.name || 'User';
  document.getElementById('sb-email').textContent = u.email || '';
  // sidebar
  const sbAv=document.getElementById('sb-av');
  if(u.picture){ sbAv.innerHTML=`<img src="${u.picture}" style="width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.15)" alt="">`; }
  else { const d=document.createElement('div');d.style.cssText=`width:30px;height:30px;border-radius:50%;background:${colorFor(u.name||'U')};color:white;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center`;d.textContent=initials(u.name||'U');sbAv.appendChild(d); }
  // header
  const hAv=document.getElementById('hdr-av');
  if(u.picture){ hAv.innerHTML=`<img src="${u.picture}" class="u-avatar" title="${u.email}" alt="">`; }
  else { const d=document.createElement('div');d.className='u-init';d.title=u.email;d.textContent=initials(u.name||'U');d.style.background=colorFor(u.name||'U');hAv.appendChild(d); }
}

/* ── Stats ── */
function updateStats(emails){
  let safe=0,susp=0;
  let incoming=0,outgoing=0,reply=0;
  emails.forEach(e=>{
    const l=riskLevel(e.analysis);
    if(l==='SAFE') safe++;
    else if(l==='SUSPICIOUS') susp++;
    // Direction counts
    const dir = e.direction || 'UNKNOWN';
    if(dir==='INCOMING') incoming++;
    else if(dir==='OUTGOING') outgoing++;
    else if(dir==='REPLY') reply++;
  });
  document.getElementById('st-total').textContent=emails.length;
  document.getElementById('st-safe').textContent=safe;
  document.getElementById('st-med').textContent=susp;
  document.getElementById('b-all').textContent=emails.length;
  document.getElementById('b-SUSPICIOUS').textContent=susp;
  document.getElementById('b-SAFE').textContent=safe;
  // Direction badges
  document.getElementById('b-INCOMING').textContent=incoming;
  document.getElementById('b-OUTGOING').textContent=outgoing;
  document.getElementById('b-REPLY').textContent=reply;
  document.getElementById('notif-dot').style.display=(susp>0)?'block':'none';
}

/* ── Filter & search ── */
const DIRECTION_FILTERS = ['INCOMING','OUTGOING','REPLY'];
function getFiltered(){
  return allEmails.filter(e=>{
    const l=riskLevel(e.analysis);
    if(curFilter!=='all'){
      // Direction filters
      if(DIRECTION_FILTERS.includes(curFilter)){
        if((e.direction||'UNKNOWN')!==curFilter) return false;
      } else {
        // Risk-level filters
        if(l!==curFilter) return false;
      }
    }
    if(searchQ){
      const q=searchQ.toLowerCase();
      return (e.subject||'').toLowerCase().includes(q)||(e.sender||'').toLowerCase().includes(q)||(e.snippet||'').toLowerCase().includes(q);
    }
    return true;
  });
}

function setFilter(f){
  curFilter=f;
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  const navId = f==='all' ? 'nav-all' : 'nav-'+f;
  const el=document.getElementById(navId);if(el)el.classList.add('active');
  closeSB(); renderList();
}

function onSearch(v){ searchQ=v.trim(); renderList(); }

/* ── Date formatter ── */
function fmtDate(s){
  if(!s)return'';
  try{
    // If s is all digits (e.g. Gmail internalDate), parse it as int
    const ts = /^\d+$/.test(s) ? parseInt(s, 10) : s;
    const d=new Date(ts),now=new Date();
    if(isNaN(d))return s;
    if(d.toDateString()===now.toDateString())return d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    const yest=new Date(now);yest.setDate(yest.getDate()-1);
    if(d.toDateString()===yest.toDateString())return'Yesterday';
    if(now-d<7*86400000)return d.toLocaleDateString([],{weekday:'short'});
    return d.toLocaleDateString([],{month:'short',day:'numeric'});
  }catch{return s;}
}
/* ── Full Date formatter ── */
function fmtFullDate(s){
  if(!s)return'-';
  try{
    const ts = /^\d+$/.test(s) ? parseInt(s, 10) : s;
    const d=new Date(ts);
    if(isNaN(d))return s;
    return d.toLocaleString([],{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }catch{return s;}
}

/* ── HTML escape ── */
function esc(s){ return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Parse sender ── */
function parseSender(raw){
  const nm=raw.match(/^([^<]+)</), em=raw.match(/<([^>]+)>/);
  return { name:(nm?nm[1].trim():raw.replace(/<.*>/,'').trim()||'Unknown'), email:(em?em[1]:raw) };
}

/* ── Render list ── */
function renderList(){
  const emails=getFiltered();
  const LABELS={all:'All Emails',SUSPICIOUS:'Suspicious',SAFE:'Safe',INCOMING:'Incoming',OUTGOING:'Outgoing',REPLY:'Replies'};
  document.getElementById('t-title').textContent=LABELS[curFilter]||'Inbox';
  document.getElementById('t-sub').textContent=emails.length===0?'No emails in this category':`${emails.length} email${emails.length!==1?'s':''} analyzed`;

  const list=document.getElementById('email-list');
  if(emails.length===0){
    list.innerHTML=`<div class="state-box"><div class="state-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2-2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><div class="state-title">No emails found</div><div class="state-msg">No emails match the selected filter or search query.</div></div>`;
    return;
  }
  list.innerHTML='';
  emails.forEach(email=>{
    const {name,email:addr}=parseSender(email.sender||'');
    const lvl=riskLevel(email.analysis);
    const score=email.analysis?email.analysis.score:0;
    const row=document.createElement('div');
    row.className='erow'+(email.isUnread?' unread':'');
    row.onclick=()=>openDetail(email);

    const av=document.createElement('div');
    av.className='e-avatar';
    av.style.cssText=`width:36px;height:36px;background:${colorFor(name)};font-size:13px`;
    av.textContent=initials(name);

    const main=document.createElement('div');
    main.className='e-main';
    const dir = email.direction || 'UNKNOWN';
    const DIR_ICONS = {
      INCOMING:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 16 12 14 15 10 15 8 12 2 12"/></svg>',
      OUTGOING:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>',
      REPLY:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 17 4 12 9 7"/><path d="M20 18v-2a4 4 0 00-4-4H4"/></svg>',
      UNKNOWN:''
    };
    main.innerHTML=`<div class="e-top"><span class="e-name">${esc(name)}</span><span class="e-email">&lt;${esc(addr)}&gt;</span><span class="dbadge ${dir}">${DIR_ICONS[dir]||''}${dir}</span></div><div class="e-subject">${esc(email.subject||'(No Subject)')}</div><div class="e-preview">${esc(email.snippet||email.body||'')}</div>`;

    const meta=document.createElement('div');
    meta.className='e-meta';
    const displayDate = email.gmail_internal_date || email.date;
    meta.innerHTML=`<span class="e-date">${esc(fmtDate(displayDate))}</span><span class="rbadge ${lvl}">${riskLabel(lvl)}</span><span class="rscore">${score}/100</span>`;

    row.appendChild(av);row.appendChild(main);row.appendChild(meta);
    list.appendChild(row);
  });
}

/* ── Detail view ── */
function openDetail(email){
  const {name,email:addr}=parseSender(email.sender||'');
  const a=email.analysis||{};
  const lvl=riskLevel(a);
  const score=a.score||0;
  const conf=a.confidence!=null?Math.round(a.confidence*100):null;
  const reasons=a.reasons||a.signs||[];
  const urls=a.detectedUrls||[];
  const isRisky=lvl==='SUSPICIOUS';

  document.getElementById('d-title').textContent=email.subject||'(No Subject)';
  const badge=document.getElementById('d-badge');
  badge.className=`rbadge ${lvl}`;badge.textContent=riskLabel(lvl);

  const actionsDiv=document.getElementById('d-actions');
  actionsDiv.innerHTML = '';
  if(isRisky) {
    const repBtn=document.createElement('button');
    repBtn.className='d-action-btn primary';
    repBtn.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> DOWNLOAD FORENSIC REPORT';
    repBtn.onclick = () => downloadForensicReport(email);
    actionsDiv.appendChild(repBtn);
  }

  const signsHtml=reasons.length>0
    ?reasons.map(r=>`<div class="reason-item"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color:${isRisky?'var(--high)':'var(--med)'}"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg><span>${esc(r)}</span></div>`).join('')
    :`<div class="reason-item"><span style="color:var(--muted)">No suspicious indicators detected.</span></div>`;

  const urlsHtml=urls.length>0
    ?`<div class="url-block"><div class="d-sec-title">Detected Domains</div>${urls.map(u=>`<div class="url-item">${esc(u)}</div>`).join('')}</div>`
    :'';

  const dir = email.direction || 'UNKNOWN';
  document.getElementById('d-body').innerHTML=`
    <div class="d-meta">
      <div class="d-meta-row"><span class="d-meta-lbl">From</span><span class="d-meta-val">${esc(name)} &lt;${esc(addr)}&gt;</span></div>
      <div class="d-meta-row"><span class="d-meta-lbl">To</span><span class="d-meta-val">${esc(email.recipient||'–')}</span></div>
      <div class="d-meta-row"><span class="d-meta-lbl">Subject</span><span class="d-meta-val">${esc(email.subject||'(No Subject)')}</span></div>
      <div class="d-meta-row"><span class="d-meta-lbl">Date</span><span class="d-meta-val">${esc(fmtFullDate(email.gmail_internal_date || email.date))}</span></div>
      <div class="d-meta-row"><span class="d-meta-lbl">Direction</span><span class="d-meta-val"><span class="dbadge ${dir}">${dir}</span></span></div>
    </div>
    <div class="d-sec-title">Message Content</div>
    <div class="d-content" style="padding:0; overflow:hidden;">
      ${email.htmlBody 
        ? `<iframe srcdoc="${esc(email.htmlBody)}" style="width:100%; height:400px; border:none; background:#fff;"></iframe>`
        : `<div style="padding:15px; white-space:pre-wrap;">${esc(email.plainBody||email.body||email.snippet||'No content available.')}</div>`
      }
    </div>
    <div class="d-sec-title">Security Analysis</div>
    <div class="analysis-card">
      <div class="ac-hdr"><span class="ac-hdr-title">Threat Assessment</span><span class="rbadge ${lvl}">${riskLabel(lvl)}</span></div>
      <div class="score-row">
        <div class="score-circle ${lvl}"><span class="score-num">${score}</span><span class="score-den">/100</span></div>
        <div class="score-info">
          <div class="score-level ${lvl}">${riskLabel(lvl)}</div>
          ${conf!=null?`<div class="score-conf">Confidence: ${conf}%</div>`:''}
          <div class="score-expl">${esc(a.explanation||'')}</div>
        </div>
      </div>
      <div class="reasons-block"><div class="d-sec-title" style="margin-bottom:8px">Why was this flagged?</div>${signsHtml}</div>
      ${urlsHtml}
    </div>

    <div class="d-sec-title">Approximate Network Location</div>
    <div class="analysis-card" style="margin-bottom:20px;" id="geo-card-${email.id}">
      ${email.origin_ip ? `
        <div class="d-meta" id="geo-inner-${email.id}">
          <div class="d-meta-row"><span class="d-meta-lbl">Origin IP</span><span class="d-meta-val" style="font-family:monospace;">${esc(email.origin_ip)}</span></div>
          <div class="d-meta-row"><span class="d-meta-lbl">IP Role</span><span class="d-meta-val">${esc(email.origin_ip_role)}</span></div>
          
          <div class="d-meta-row" style="margin-top:10px;"><span class="d-meta-lbl">Country</span><span class="d-meta-val">${esc(email.geolocation_country || 'Unknown')}</span></div>
          <div class="d-meta-row"><span class="d-meta-lbl">Region</span><span class="d-meta-val">${esc(email.geolocation_region || '-')}</span></div>
          <div class="d-meta-row"><span class="d-meta-lbl">City</span><span class="d-meta-val">${esc(email.geolocation_city || '-')}</span></div>
          
          <div class="d-meta-row" style="margin-top:10px;"><span class="d-meta-lbl">Confidence</span><span class="d-meta-val" style="${email.geolocation_confidence && email.geolocation_confidence.startsWith('Low') ? 'color:var(--high); font-weight:bold;' : 'color:var(--low);'}">${esc(email.geolocation_confidence || 'High')}</span></div>
          <div class="d-meta-row"><span class="d-meta-lbl">Source Header</span><span class="d-meta-val" style="font-family:monospace;">${esc(email.geolocation_source_header || 'Unknown')}</span></div>
          
          <div class="d-meta-row" style="margin-top:15px; font-size:11px; color:#666; font-style:italic; border-top:1px dashed #e2e8f0; padding-top:10px;">
            <span class="d-meta-val">IP geolocation represents an approximate network location and does not establish the physical location or identity of the sender.</span>
          </div>
        </div>
      ` : `
        <div class="d-meta">
          <div class="d-meta-row"><span class="d-meta-lbl">Origin IP</span><span class="d-meta-val">Not available</span></div>
          <div class="d-meta-row"><span class="d-meta-lbl">Location</span><span class="d-meta-val">Unavailable</span></div>
          <div class="d-meta-row" style="margin-top:10px;"><span class="d-meta-val" style="color:#666; font-style:italic;">No reliable network-origin IP was available in the email headers.</span></div>
        </div>
      `}
    </div>

    <div class="action-card ${isRisky?'warning':'safe'}">
      ${isRisky
        ?`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>`
        :`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 11-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>`
      }
      <div><div class="action-lbl">Recommended Action</div><div class="action-txt">${esc(a.action||'')}</div></div>
    </div>
  `;

  
  document.getElementById('d-overlay').classList.add('open');
  document.body.style.overflow='hidden';
}

function parseAuthResults(authHeader) {
  if(!authHeader) return {spf:'NOT AVAILABLE', dkim:'NOT AVAILABLE', dmarc:'NOT AVAILABLE', arc:'NOT AVAILABLE'};
  const getRes = (mech) => {
    const m = authHeader.toLowerCase().match(new RegExp(`${mech}=([a-z]+)`));
    return m ? m[1].toUpperCase() : 'NOT AVAILABLE';
  };
  return {spf:getRes('spf'), dkim:getRes('dkim'), dmarc:getRes('dmarc'), arc:getRes('arc')};
}

function downloadForensicReport(email) {
  const {name, email:addr} = parseSender(email.sender||'');
  const a = email.analysis || {};
  const score = a.score || 0;
  const conf = a.confidence!=null ? Math.round(a.confidence*100) : null;
  const auth = parseAuthResults(email.authResults);
  const now = new Date().toLocaleString();
  const reportId = 'EVID-' + Date.now().toString(36).toUpperCase() + '-' + Math.floor(Math.random()*10000);

  const findingsList = (a.reasons||a.signs||[]).map((r, i) => `
    <div style="margin-bottom:12px;">
      <div style="font-weight:bold; color:#111;">Finding ${String(i+1).padStart(2,'0')}</div>
      <div style="padding-left:10px; border-left:2px solid #dc2626;">
        <strong>Indicator:</strong> ${esc(r)}<br>
        <strong>Analysis Result:</strong> Suspicious characteristic detected in email metadata or content.
      </div>
    </div>
  `).join('');
  
  const urlsHtml = (a.detectedUrls||[]).map(u=>`
    <div style="margin-bottom:10px;">
      <strong>Displayed URL:</strong> <code>${esc(u)}</code><br>
      <strong>Domain:</strong> <code>${esc(u.split('/')[2]||'Unknown')}</code><br>
      <strong>Analysis Result:</strong> Flagged during security scan.
    </div>
  `).join('') || 'No suspicious URLs detected.';
  
  let attachHtml = 'No attachments detected.';
  if(email.attachments && email.attachments.length>0) {
    attachHtml = email.attachments.map(att=>`
      <div style="margin-bottom:10px;">
        <strong>Filename:</strong> <code>${esc(att.filename)}</code><br>
        <strong>MIME type:</strong> ${esc(att.mimeType)}<br>
        <strong>Size:</strong> ${att.size} bytes<br>
        <strong>SHA-256 hash:</strong> Not available without full file download<br>
      </div>
    `).join('');
  }

  const html = `
    <div style="padding:40px; font-family:'Helvetica Neue', Helvetica, Arial, sans-serif; color:#333; max-width:850px; margin:0 auto; font-size:12px; line-height:1.5;">
      <div style="text-align:center; border-bottom:3px solid #1a202c; padding-bottom:15px; margin-bottom:20px;">
        <h1 style="color:#1a202c; font-size:22px; margin:0 0 5px 0;">EMAIL SECURITY & DIGITAL EVIDENCE REPORT</h1>
        <div style="font-size:14px; color:#4a5568; font-weight:bold;">Suspected Phishing / Suspicious Email Analysis</div>
      </div>

        <tr>
          <td style="padding:8px; border:1px solid #e2e8f0; width:50%;">
            <strong>Report ID:</strong> ${reportId}<br>
            <strong>Generated On:</strong> ${now}<br>
            <strong>Analysis Date:</strong> ${now}<br>
            <strong>Report Version:</strong> 1.0
          </td>
          <td style="padding:8px; border:1px solid #e2e8f0; width:50%;">
            <strong>Classification:</strong> <span style="color:#dc2626; font-weight:bold;">SUSPICIOUS</span><br>
            <strong>Risk Score:</strong> ${score}/100<br>
            <strong>Confidence:</strong> ${conf!=null?conf+'%':'Not available'}
          </td>
        </tr>
      </table>

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">1. Incident Summary</h2>
      <p style="text-align:justify;">This report documents the technical analysis of an email identified as suspicious by the application's email security analysis engine. The assessment identified the security indicators documented in this report. The email is classified as a potential security concern and should be handled with appropriate caution.</p>

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">2. Original Email Information</h2>
      <table style="width:100%; border-collapse:collapse; margin-bottom:10px;">
        <tr><td style="padding:3px 0; width:130px; font-weight:bold;">Message ID:</td><td>${esc(email.messageId||email.id)}</td></tr>
        <tr><td style="padding:3px 0; font-weight:bold;">Thread ID:</td><td>${esc(email.threadId||'-')}</td></tr>
        <tr><td style="padding:3px 0; font-weight:bold;">From:</td><td>${esc(name)} &lt;${esc(addr)}&gt;</td></tr>
        <tr><td style="padding:3px 0; font-weight:bold;">To:</td><td>${esc(email.recipient||'-')}</td></tr>
        ${email.cc ? `<tr><td style="padding:3px 0; font-weight:bold;">CC:</td><td>${esc(email.cc)}</td></tr>` : ''}
        <tr><td style="padding:3px 0; font-weight:bold;">Subject:</td><td>${esc(email.subject||'(No Subject)')}</td></tr>
        <tr><td style="padding:3px 0; font-weight:bold;">Date / Time:</td><td>${esc(fmtFullDate(email.gmail_internal_date || email.date))}</td></tr>
        <tr><td style="padding:3px 0; font-weight:bold;">Direction:</td><td>${esc(email.direction||'UNKNOWN')}</td></tr>
      </table>

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">3. Approximate Network Location</h2>
      <div style="margin-bottom:10px;">
        <div style="font-weight:bold;">Origin IP: <span style="font-weight:normal; font-family:monospace;">${esc(email.origin_ip || 'Not available')}</span></div>
        <div style="font-weight:bold;">IP Role: <span style="font-weight:normal;">${esc(email.origin_ip_role || 'Not available')}</span></div>
        <div style="font-weight:bold;">Network Location: <span style="font-weight:normal;">${esc(email.geolocation_country ? (email.geolocation_city + ', ' + email.geolocation_region + ', ' + email.geolocation_country) : 'Unknown')}</span></div>
        <div style="font-style:italic; font-size:10px; color:#666; margin-top:5px;">Note: IP geolocation represents an approximate network location and does not establish the physical location or identity of the sender.</div>
      </div>

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">3. Full Email Header Information</h2>
      <p>Full original email headers are retained internally by the application for technical investigation and security evidence processing.</p>


      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">4. Email Content</h2>
      <div style="font-weight:bold; margin-bottom:5px;">ORIGINAL EMAIL CONTENT (Sanitized for Display)</div>
      <div style="background:#f7fafc; border:1px solid #e2e8f0; padding:10px; max-height:200px; overflow:hidden; white-space:pre-wrap; word-break:break-word; font-family:monospace; font-size:11px;">${esc(email.body||email.snippet||'No content available.')}</div>

      <div style="page-break-before:always;"></div>

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">5. Security Analysis</h2>
      <div style="margin-bottom:15px;">
        <strong>Classification:</strong> SUSPICIOUS<br>
        <strong>Risk Score:</strong> ${score} / 100<br>
        <strong>Confidence:</strong> ${conf!=null?conf+'%':'Not available'}
      </div>
      ${findingsList || '<p>No specific structural indicators logged.</p>'}

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">6. URL / Domain Evidence</h2>
      ${urlsHtml}

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">7. Email Authentication</h2>
      <ul style="margin:0; padding-left:20px;">
        <li><strong>SPF:</strong> ${esc(auth.spf)}</li>
        <li><strong>DKIM:</strong> ${esc(auth.dkim)}</li>
        <li><strong>DMARC:</strong> ${esc(auth.dmarc)}</li>
        <li><strong>ARC:</strong> ${esc(auth.arc)}</li>
      </ul>

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">8. Attachment Evidence</h2>
      ${attachHtml}

      <h2 style="font-size:14px; color:#1a202c; border-bottom:1px solid #cbd5e0; padding-bottom:4px; margin-top:20px; text-transform:uppercase;">9. Evidence Integrity</h2>
      <p style="margin-bottom:5px;">The hash is provided as an integrity reference for the corresponding preserved evidence file.</p>
      <table style="width:100%; border-collapse:collapse; margin-bottom:10px; background:#f7fafc; border:1px solid #e2e8f0;">
        <tr><td style="padding:6px; font-weight:bold; width:150px; border-bottom:1px solid #e2e8f0;">Evidence Item:</td><td style="padding:6px; border-bottom:1px solid #e2e8f0;">Original Email Body Content</td></tr>
        <tr><td style="padding:6px; font-weight:bold; border-bottom:1px solid #e2e8f0;">Hash Algorithm:</td><td style="padding:6px; border-bottom:1px solid #e2e8f0;">SHA-256</td></tr>
        <tr><td style="padding:6px; font-weight:bold;">SHA-256 Hash:</td><td style="padding:6px; font-family:monospace; word-break:break-all;">${esc(email.contentHash||'Not available')}</td></tr>
      </table>

      <div style="margin-top:40px; padding:15px; border-top:2px solid #cbd5e0; font-size:10px; color:#718096; text-align:justify; background:#f7fafc;">
        <strong>DISCLAIMER:</strong> This report is a technical cybersecurity analysis generated from the available email data. It is intended to assist with incident reporting and investigation. It does not constitute a legal determination, certified forensic examination, or guarantee of legal admissibility. The information presented is based strictly on the data available via the connected email API at the time of analysis.
      </div>
    </div>
  `;

  const opt = {
    margin:       0,
    filename:     `evidence_report_${email.id}.pdf`,
    image:        { type: 'jpeg', quality: 0.98 },
    html2canvas:  { scale: 2 },
    jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
  };
  
  toast('Generating evidence report...');
  html2pdf().set(opt).from(html).save().then(()=>{
    toast('Digital evidence report downloaded.');
  });
}

function closeDetail(){ document.getElementById('d-overlay').classList.remove('open'); document.body.style.overflow=''; }
function overlayClick(e){ if(e.target===document.getElementById('d-overlay'))closeDetail(); }

/* ── Fetch emails ── */
let isFetching = false;
let currentRunId = null;

async function fetchEmails(manual=false) {
  if(isFetching) return;
  isFetching = true;
  const refBtn = document.getElementById('ref-btn');
  if(manual){ refBtn.disabled=true; refBtn.classList.add('spinning'); }
  
  try {
    document.getElementById('email-list').innerHTML = `
      <div class="state-box">
        <div class="spinner"></div>
        <div class="state-title">Connecting to Gmail…</div>
        <div class="state-msg" id="fetch-progress">Initializing authoritative analysis run...</div>
      </div>
    `;

    const startRes = await fetch('/api/analysis/start', { method: 'POST' });
    if (!startRes.ok) {
      if(startRes.status===401) setTimeout(()=>location.href='/index.html',2000);
      throw new Error('Failed to start analysis');
    }
    const startData = await startRes.json();
    currentRunId = startData.run_id;
    
    // Poll authoritative status
    while (true) {
      await new Promise(r => setTimeout(r, 1000));
      if (currentRunId !== startData.run_id) return; // aborted by newer run
      
      const statusRes = await fetch('/api/analysis/status?run_id=' + currentRunId);
      if (!statusRes.ok) break;
      const st = await statusRes.json();
      
      const pEl = document.getElementById('fetch-progress');
      if(st.status === 'discovering') {
         if(pEl) pEl.textContent = `Discovering messages in mailbox... (${st.discovered} found)`;
      } else if (st.status === 'analyzing') {
         if(pEl) pEl.textContent = `Analyzing ${st.analyzed} / ${st.discovered} discovered messages...`;
      } else if (st.status === 'complete') {
         break;
      }
    }
    
    // Fetch final frozen result
    const resultRes = await fetch('/api/analysis/result?run_id=' + currentRunId);
    if (!resultRes.ok) throw new Error('Failed to fetch results');
    const resultData = await resultRes.json();
    
    allEmails = resultData.messages || [];
    
    // Derive all UI state from the single authoritative backend result array
    updateStats(allEmails);
    renderList();
    
    if(manual) toast(`Mailbox synchronized. ${resultData.total_analyzed} emails analyzed.`);
  } catch(err) {
    console.error(err);
    document.getElementById('email-list').innerHTML = `<div class="state-box"><div class="state-title">Error</div><div class="state-msg">Failed to synchronize mailbox.</div></div>`;
    if(manual) toast('Network error. Please try again.');
  } finally {
    isFetching = false;
    if(manual){ refBtn.disabled=false; refBtn.classList.remove('spinning'); }
  }
}
function manualRefresh(){ fetchEmails(true); }

/* ── Init ── */
async function init(){
  try{
    const r=await fetch('/api/me');
    if(!r.ok){ location.href='/index.html'; return; }
    renderUser(await r.json());
  }catch{ location.href='/index.html'; return; }
  await fetchEmails(false);
  setInterval(()=>fetchEmails(false), 30000);
}

init();
